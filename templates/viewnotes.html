{% extends 'base.html' %}

{% block title %}All Notes{% endblock %}

{% block content %}

<style>
/* ===== Search Bar Styling ===== */

.search-wrapper {
  background: #e6f0ff;
  padding: 15px 0;
}

.search-form {
  display: flex;
  justify-content: center;
  align-items: stretch;   /* IMPORTANT FIX */
  max-width: 600px;
  margin: auto;
}

.search-form input {
  flex: 1;
  height: 45px;           /* Slightly bigger */
  padding: 0 15px;
  border-radius: 8px 0 0 8px;
  border: 1px solid #ccc;
  border-right: none;
  font-size: 14px;
  outline: none;
  box-sizing: border-box;
}

.search-form button {
  height: 45px;           /* EXACT same height */
  width: 48px;
  border: 1px solid #007bff;
  border-left: none;
  border-radius: 0 8px 8px 0;
  background: #007bff;
  color: white;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0;
  line-height: 1;
}
</style>

<!-- Search Bar -->
<div class="search-wrapper">
  <form action="{{ url_for('search') }}" method="get" class="search-form">
    <input type="text" name="q"
           placeholder="Search notes..."
           value="{{ search_text or '' }}">
    <button type="submit">🔍</button>
  </form>
</div>

<!-- Notes Heading -->
<h3 class="mt-4 mb-4 text-center">My Notes</h3>

<!-- Notes Grid -->
<div class="row">
  {% if notes %}
    {% for note in notes %}
      <div class="col-md-6 col-lg-4 mb-4">
        <div class="card h-100 shadow-sm bg-info bg-opacity-25">
          <div class="card-body d-flex flex-column">

            <h5 class="card-title">{{ note.title }}</h5>
            <p class="card-text text-truncate">{{ note.content }}</p>

            <p class="mt-auto mb-1 text-muted small">
              {{ note.created_at }}
            </p>

            <div class="mt-2 d-flex gap-2">
              <a class="btn btn-sm btn-warning"
                 href="{{ url_for('updatenote', note_id=note.id) }}">
                Edit
              </a>

              <form action="{{ url_for('deletenote', note_id=note.id) }}"
                    method="POST" class="d-inline">
                <button class="btn btn-sm btn-danger"
                        type="submit"
                        onclick="return confirm('Delete this note?')">
                  Delete
                </button>
              </form>
            </div>

          </div>
        </div>
      </div>
    {% endfor %}
  {% else %}
    <!-- No Notes Found -->
    <div class="col-md-6 mx-auto">
      <div class="card shadow-sm bg-light border border-info text-center p-4">
        <p class="text-muted mb-3">No notes found here....</p>
        <a href="{{ url_for('addnote') }}" class="btn btn-info btn-sm">
          Create a note
        </a>
      </div>
    </div>
  {% endif %}
</div>

{% endblock %}
